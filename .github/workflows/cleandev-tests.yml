name: cleandev tests

on:
  push:
    paths:
      - "cleandev/**"
      - ".github/workflows/cleandev-tests.yml"
  pull_request:
    paths:
      - "cleandev/**"
      - ".github/workflows/cleandev-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run cleandev test suite
        run: bash cleandev/tests/run.sh
